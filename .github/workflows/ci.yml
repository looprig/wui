name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # `make check` is the single gate: fmt-check, vet, staticcheck, gosec,
      # go mod verify, govulncheck, go test -race and go build. Every target
      # already sets GOWORK=off, so this runs the module standalone.
      - name: Repository checks
        run: make check
      # AGENTS.md mandates an explicit standalone run with no workspace masking.
      - name: Standalone verification
        run: GOWORK=off go test ./...

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @looprig/react runs in Vitest BROWSER mode, so it needs the real
      # Chromium binary, which the npm package does not carry. Without this the
      # whole react suite fails to start -- and `--if-present` would not save
      # it, because the script IS present. `--with-deps` installs the shared
      # libraries a bare ubuntu-latest runner lacks.
      - run: npx playwright install --with-deps chromium
      # The npm workspaces carry the OTHER half of the wire-contract drift
      # guard: contract/contract_test.go proves contract/ matches the pinned
      # harness bytes, and packages/protocol validates those same bytes against
      # the schemas with ajv (harness is stdlib-only and cannot). Without this
      # job that half never runs in CI -- and a suite CI never runs is
      # indistinguishable from a passing one, which is the exact failure the
      # deferred-ports tripwire existed to prevent.
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
