name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # `make check` is the single gate: fmt-check, vet, staticcheck, gosec,
      # go mod verify, govulncheck, go test -race and go build. Every target
      # already sets GOWORK=off, so this runs the module standalone.
      - name: Repository checks
        run: make check
      # AGENTS.md mandates an explicit standalone run with no workspace masking.
      - name: Standalone verification
        run: GOWORK=off go test ./...

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @looprig/react runs in Vitest BROWSER mode, so it needs the real
      # Chromium binary, which the npm package does not carry. Without this the
      # whole react suite fails to start -- and `--if-present` would not save
      # it, because the script IS present. `--with-deps` installs the shared
      # libraries a bare ubuntu-latest runner lacks.
      - run: npx playwright install --with-deps chromium
      # The npm workspaces carry the other half of the wire-contract story, and
      # what that half currently IS is worth stating precisely, because the
      # comment this replaces went on describing the previous arrangement after
      # it stopped being true.
      #
      # As of U0.1, contract/contract_test.go proves contract/ matches the bytes
      # of the pinned CORE module's sessionwire/v1 -- not harness, which is no
      # longer in this module's graph at all. @looprig/protocol does NOT yet
      # validate those Core bytes with ajv: its TypeScript schema mirror still
      # describes the Harness-era contract, so the two disagree. That
      # disagreement is deliberate, permitted by the Wave 2 checkpoint, and
      # recorded file-by-file in packages/protocol/test/known-drift.json;
      # reconciling it is Wave 4C protocol work, blocked on Factory contract
      # fixtures that do not exist yet.
      #
      # The suite still RUNS here, every test of it. @looprig/protocol's `test`
      # script is scripts/known-drift-gate.mjs, which fails on any failing file
      # the recorded allowance does not cover and on any allowance that has gone
      # stale. Dropping the workspace would leave a suite CI never runs, which
      # is indistinguishable from a passing one -- the exact failure the
      # deferred-ports tripwire existed to prevent -- and a blanket
      # continue-on-error is that same failure wearing a different hat: it would
      # hide every future regression in the 26 healthy files for as long as the
      # drift lasts.
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
